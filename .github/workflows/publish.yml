name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      validation_report_sha256: ${{ steps.integrity.outputs.report_sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install artifact-check dependencies
        run: python -m pip install build ".[attune-help]"

      - name: Build and validate distributions
        run: python scripts/check_distribution.py --output-dir dist --report artifact-validation.json

      - name: Record validation receipt hash
        id: integrity
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          digest = hashlib.sha256(Path("artifact-validation.json").read_bytes()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"report_sha256={digest}\n")
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload validation receipt
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.1
        with:
          name: distribution-validation
          path: artifact-validation.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # Required for OIDC trusted publishing
    steps:
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Download validation receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution-validation
          path: validation/

      - name: Verify validated artifact bytes
        env:
          EXPECTED_REPORT_SHA256: ${{ needs.build.outputs.validation_report_sha256 }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          raw = Path("validation/artifact-validation.json").read_bytes()
          require(hashlib.sha256(raw).hexdigest() == os.environ["EXPECTED_REPORT_SHA256"],
                  "Validation receipt checksum mismatch")
          report = json.loads(raw)
          require(report.get("status") == "passed", "Artifact validation did not pass")
          artifacts = report.get("artifacts", {})
          require(isinstance(artifacts, dict) and len(artifacts) == 2,
                  "Expected exactly one wheel and one sdist")
          require(sum(name.endswith(".whl") for name in artifacts) == 1
                  and sum(name.endswith(".tar.gz") for name in artifacts) == 1,
                  "Expected exactly one wheel and one sdist")
          paths = list(Path("dist").iterdir())
          require({path.name for path in paths} == set(artifacts),
                  "Downloaded artifact set differs from validated set")
          for path in paths:
              require(path.is_file() and not path.is_symlink(), "Expected regular artifact file")
              require(hashlib.sha256(path.read_bytes()).hexdigest()
                      == artifacts[path.name]["sha256"], f"Artifact checksum mismatch: {path.name}")
          print("Exact validated sdist and wheel verified for publication")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.14.0
        # No token — uses OIDC trusted publishing.
        # REQUIRES: Add a pending publisher on pypi.org:
        #   pypi.org/manage/account/publishing/
        #   - project: attune-rag
        #   - owner:   Smart-AI-Memory
        #   - repo:    attune-rag
        #   - workflow: publish.yml
        #   - environment: pypi
